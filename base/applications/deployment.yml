apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder1-service
  labels:
    app.kubernetes.io/name: placeholder1-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: placeholder1-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placeholder1-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: placeholder1-service
          image: ghcr.io/lmbek/lmbek-hobby-placeholder1-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
