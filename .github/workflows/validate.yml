name: Validate Kubernetes manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4.0.1
        with:
          version: v1.36.4

      - name: Render production overlay
        run: kubectl kustomize overlays/production > /tmp/production.yaml

      - name: Check rendered routes
        run: |
          grep -q 'host: lmbek.dk' /tmp/production.yaml
          grep -q 'certresolver: letsencrypt' /tmp/production.yaml
          grep -q 'namespace: production' /tmp/production.yaml