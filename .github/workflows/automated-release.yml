name: Deploy production

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: platform-release
  cancel-in-progress: false

env:
  APP_DOMAIN: lmbek.dk
  GHCR_USERNAME: lmbek

jobs:
  deploy:
    name: Resolve immutable images and deploy
    runs-on: [self-hosted, linux, x64, k3s-production]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out trusted platform state
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Resolve production tags to immutable digests
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          : > /tmp/image-digests
          for image in \
            ghcr.io/lmbek/lmbek-hobby-web-frontend \
            ghcr.io/lmbek/lmbek-hobby-placeholder1-service \
            ghcr.io/lmbek/lmbek-hobby-placeholder2-service \
            ghcr.io/lmbek/lmbek-hobby-docs; do
            repository="${image#ghcr.io/}"
            token=$(curl --fail --silent --show-error --user "${GHCR_USERNAME}:${GHCR_PULL_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${repository}:pull&service=ghcr.io" | jq -r .token)
            digest=$(curl --fail --silent --show-error --head \
              --header "Authorization: Bearer ${token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://${image}/manifests/production" \
              | awk -F': ' 'tolower($1) == "docker-content-digest" {gsub("\r", "", $2); print $2}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s %s\n' "$image" "$digest" >> /tmp/image-digests
          done

          python3 - /tmp/image-digests <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("overlays/production/kustomization.yml")
          text = path.read_text()
          updated = text
          for line in Path(sys.argv[1]).read_text().splitlines():
              image, digest = line.split()
              pattern = rf"(?ms)(- name: {re.escape(image)}\n\s+digest: )sha256:[0-9a-f]{{64}}"
              updated, count = re.subn(pattern, rf"\g<1>{digest}", updated)
              if count != 1:
                  raise SystemExit(f"expected one production image entry for {image}, found {count}")
          path.write_text(updated)
          PY

      - name: Validate and record desired state
        run: |
          set -euo pipefail
          kubectl kustomize overlays/production > /tmp/production.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/production/kustomization.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy production image digests"
            git push origin HEAD:main
          fi

      - name: Verify least-privilege identity
        run: |
          set -euo pipefail
          kubectl auth can-i patch deployments --namespace production | grep -qx yes
          kubectl auth can-i get secrets --namespace production | grep -qx no
          kubectl auth can-i get secret/ghcr-pull --namespace production | grep -qx yes
          kubectl auth can-i get pods --all-namespaces | grep -qx no

      - name: Refresh private registry credential
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          kubectl create secret docker-registry ghcr-pull \
            --namespace production \
            --docker-server ghcr.io \
            --docker-username "$GHCR_USERNAME" \
            --docker-password "$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply and wait for rolling deployment
        run: |
          set -euo pipefail
          kubectl apply -k overlays/production
          for deployment in web-frontend placeholder1-service placeholder2-service docs; do
            kubectl rollout status "deployment/${deployment}" --namespace production --timeout=180s
          done

      - name: Verify public health endpoint
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-connrefused "https://${APP_DOMAIN}/healthz"