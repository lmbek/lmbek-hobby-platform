apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder1-service
  labels:
    app.kubernetes.io/name: placeholder1-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: placeholder1-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placeholder1-service
    spec:
      containers:
        - name: placeholder1-service
          image: ghcr.io/lmbek/lmbek-hobby-placeholder1-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
